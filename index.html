<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Xenonika sells</title>
    <meta name="title" content="Xenonika sells">
    <meta name="description" content="sasta kharido, achcha kharido, trusted kharido - Best deals from Amazon, Flipkart, Ajio, Meesho and more.">

    <!-- Favicon / Website Logo -->
    <link rel="icon" type="image/png" href="lg.png">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Open Graph / Facebook / WhatsApp Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Xenonika sells">
    <meta property="og:description" content="sasta kharido, achcha kharido, trusted kharido">
    <meta property="og:image" content="logo.png">

    <!-- Twitter Meta Tags -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Xenonika sells">
    <meta property="twitter:description" content="sasta kharido, achcha kharido, trusted kharido">
    <meta property="twitter:image" content="logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #070913;
            color: #ffffff;
            padding-bottom: 40px;
        }

        /* Header & Navigation */
        header {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            padding: 20px 20px;
            text-align: center;
            border-bottom: 2px solid #1f314d;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 8px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .tagline {
            font-size: 14px;
            color: #a0aec0;
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Container Limit for Large Screens */
        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 15px;
        }

        /* Section Titles */
        .section-title {
            font-size: 15px;
            color: #63b3ed;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* Stores Navigation Bar - Grid & Full Stretch */
        .store-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px;
            background-color: #0b111e;
            border-radius: 12px;
            border: 1px solid #1a273a;
        }

        .store-btn {
            flex: 1 1 calc(20% - 12px);
            min-width: 140px;
            text-align: center;
            background: linear-gradient(145deg, #131c2e, #1b263b);
            color: #ffffff;
            border: 2px solid #2a3f5f;
            padding: 14px 18px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .store-btn.active, .store-btn:hover {
            background: linear-gradient(145deg, #00d4ff, #0077b6);
            color: #070913;
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 212, 255, 0.3);
        }

        /* Categories Bar - Full Stretch */
        .category-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            background-color: #0b111e;
            border-radius: 12px;
            border: 1px solid #1a273a;
        }

        .cat-btn {
            flex: 1 1 calc(16% - 10px);
            min-width: 110px;
            text-align: center;
            background-color: #101726;
            color: #cbd5e0;
            border: 1px solid #1e2d42;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: #1b263b;
            border-color: #00d4ff;
            color: #00d4ff;
        }

        /* Product List Layout */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }

        .product-card {
            background: linear-gradient(135deg, #101726, #131c2e);
            border: 1px solid #1e2d42;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        .product-card:hover {
            border-color: #00d4ff;
        }

        .product-left {
            display: flex;
            align-items: center;
            gap: 16px;
            overflow: hidden;
        }

        .product-logo {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #1b263b;
            border: 1px solid #2a3f5f;
            flex-shrink: 0;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.3;
        }

        .product-store-tag {
            font-size: 11px;
            color: #00d4ff;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .buy-btn {
            background: linear-gradient(90deg, #00d4ff, #0077b6);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0, 212, 255, 0.2);
            transition: 0.2s;
        }

        .buy-btn:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00d4ff;
            font-size: 15px;
        }

        /* Responsive Mobile Layout Adjustments */
        @media (max-width: 768px) {
            .store-btn {
                flex: 1 1 calc(50% - 12px);
            }
            .cat-btn {
                flex: 1 1 calc(33.33% - 10px);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <img src="logo.png" alt="Xenonika sells Logo" class="header-logo" onerror="this.style.display='none'">
            <div class="logo">Xenonika sells</div>
        </div>
        <div class="tagline">sasta kharido, achcha kharido, trusted kharido</div>
    </header>

    <div class="wrapper">
        <!-- Top Stores Bar -->
        <div class="section-title">Select Store</div>
        <div class="store-bar">
            <button class="store-btn active" onclick="selectStore('all', this)">⚡ All Stores</button>
            <button class="store-btn" onclick="selectStore('amazon', this)">Amazon</button>
            <button class="store-btn" onclick="selectStore('flipkart', this)">Flipkart</button>
            <button class="store-btn" onclick="selectStore('ajio', this)">Ajio</button>
            <button class="store-btn" onclick="selectStore('meesho', this)">Meesho</button>
        </div>

        <!-- Categories Bar -->
        <div class="section-title">Categories</div>
        <div class="category-bar">
            <button class="cat-btn active" onclick="selectCategory('all', this)">All Items</button>
            <button class="cat-btn" onclick="selectCategory('mens', this)">Men's</button>
            <button class="cat-btn" onclick="selectCategory('womens', this)">Women's</button>
            <button class="cat-btn" onclick="selectCategory('electronics', this)">Electronics</button>
            <button class="cat-btn" onclick="selectCategory('accessories', this)">Accessories</button>
            <button class="cat-btn" onclick="selectCategory('jewellery', this)">Jewellery</button>
        </div>

        <!-- Product Container -->
        <div class="section-title">Products</div>
        <div id="productContainer" class="product-list">
            <div class="loading">Loading Products...</div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://kayasth-vision-c664a-default-rtdb.firebaseio.com/products.json";

        let allProducts = [];
        let currentStore = 'all';
        let currentCategory = 'all';

        // Fetch Data via Firebase REST API
        async function fetchProducts() {
            try {
                const response = await fetch(FIREBASE_URL);
                const data = await response.json();
                
                allProducts = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        allProducts.push({ id: key, ...data[key] });
                    });
                }
                renderProducts();
            } catch (error) {
                console.error("Error fetching products:", error);
                document.getElementById('productContainer').innerHTML = '<div class="loading">Failed to load products. Check internet connection.</div>';
            }
        }

        // Render Filtered Products
        function renderProducts() {
            const container = document.getElementById('productContainer');
            container.innerHTML = '';

            const filtered = allProducts.filter(item => {
                const matchesStore = (currentStore === 'all' || item.store === currentStore);
                const matchesCat = (currentCategory === 'all' || item.category === currentCategory);
                return matchesStore && matchesCat;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="loading">No products available in this section.</div>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-left">
                        <img src="${item.logo || 'logo.png'}" alt="Logo" class="product-logo" onerror="this.src='logo.png'">
                        <div class="product-info">
                            <span class="product-store-tag">${item.store || 'Store'}</span>
                            <div class="product-title">${item.title}</div>
                        </div>
                    </div>
                    <a href="${item.buyUrl}" target="_blank" class="buy-btn">BUY NOW</a>
                `;
                container.appendChild(card);
            });
        }

        function selectStore(store, btn) {
            document.querySelectorAll('.store-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentStore = store;
            renderProducts();
        }

        function selectCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat;
            renderProducts();
        }

        // Initial Load
        fetchProducts();
    </script>
</body>
</html>
